// This repository builds with Java 17 or newer.
if (!JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_17)) {
    throw new GradleException('Use JDK 17 or newer to build this repository.')
}
rootProject.name = 'picocli-examples'
include 'picocli-examples'

// picocli core is the separate picocli-core repository. Gradle builds it from
// source and substitutes it for info.picocli:picocli. The default location is
// a sibling checkout; override it with -PpicocliCoreDir=<path>.
includeBuild(providers.gradleProperty('picocliCoreDir').getOrElse('../picocli-core'))

// picocli-groovy is the separate picocli-groovy repository, substituted for
// info.picocli:picocli-groovy. Override its location with -PpicocliGroovyDir=<path>.
includeBuild(providers.gradleProperty('picocliGroovyDir').getOrElse('../picocli-groovy'))
